<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Finance Tracker | Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* --- Color Palette & Variables --- */

         :root {
            --bg-canvas: #f2ede4;
            --sidebar-bg: #ece7db;
            --header-black: #111111;
            --card-bg: #fcfaf7;
            --income-green: #1b5e20;
            --expense-red: #b71c1c;
            --accent-gold: #BF9B30;
            --border-light: #dcd3c1;
            --text-main: #2c2c2c;
            --input-bg: #fcfaf7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Arial', sans-serif;
            background: var(--bg-canvas);
            color: var(--text-main);
            overflow: hidden;
        }
        /* --- Header --- */

        header {
            background: var(--header-black);
            color: #fff;
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--accent-gold);
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            background: var(--accent-gold);
            color: #000;
            padding: 2px 8px;
            font-family: 'Times New Roman', serif;
            font-weight: bold;
            border-radius: 2px;
        }

        .logo-text {
            font-family: 'Times New Roman', serif;
            font-size: 1.4rem;
            letter-spacing: 0.5px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.9rem;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid #fff;
            color: #fff;
            padding: 5px 12px;
            border-radius: 4px;
            transition: 0.3s;
        }

        .logout-btn:hover {
            background: #fff;
            color: #000;
        }

        .app {
            display: flex;
            height: calc(100vh - 65px);
        }
        /* --- Sidebar (Add Transaction) --- */

        .sidebar {
            width: 320px;
            background: var(--sidebar-bg);
            padding: 25px;
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar-title {
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: #666;
            font-weight: bold;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .toggle-container {
            display: flex;
            border: 1px solid var(--border-light);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .toggle-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: #fff;
            color: #666;
            font-weight: bold;
            transition: 0.3s;
        }

        .toggle-btn.active.income {
            background: var(--income-green);
            color: #fff;
        }

        .toggle-btn.active.expense {
            background: var(--expense-red);
            color: #fff;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: bold;
            color: #888;
            margin-bottom: 5px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid var(--border-light);
            background: var(--input-bg);
            font-family: 'Courier New', Courier, monospace;
            color: #333;
        }

        .add-btn {
            background: #111;
            color: #fff;
            border: none;
            padding: 15px;
            width: 100%;
            font-weight: bold;
            letter-spacing: 1px;
            transition: 0.3s;
            margin-top: 10px;
        }

        .add-btn:hover {
            background: #333;
        }
        /* --- Main Content --- */

        .main {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }
        /* --- Financial Summary Cards (Horizontal) --- */

        .summary-row {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }

        .summary-card {
            flex: 1;
            background: var(--card-bg);
            padding: 20px;
            border: 1px solid var(--border-light);
            position: relative;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.03);
        }

        .summary-card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 6px;
        }

        .card-income::before {
            background: var(--income-green);
        }

        .card-expense::before {
            background: var(--expense-red);
        }

        .card-balance::before {
            background: var(--accent-gold);
        }

        .card-label {
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            color: #777;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .card-amount {
            font-family: 'Times New Roman', serif;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .card-subtext {
            font-size: 0.8rem;
            color: #999;
        }

        .surplus-tag {
            background: #e8f5e9;
            color: var(--income-green);
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 2px;
            display: inline-block;
            margin-top: 10px;
        }
        /* --- Transaction List --- */

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .list-header h3 {
            font-family: 'Times New Roman', serif;
            font-size: 1.8rem;
        }

        .txn-table-head {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 40px;
            padding: 10px;
            border-bottom: 1px solid var(--border-light);
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: #999;
            font-weight: bold;
        }

        .txn-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 40px;
            align-items: center;
            padding: 15px 10px;
            border-bottom: 1px solid var(--border-light);
            transition: 0.2s;
        }

        .txn-row:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .txn-desc {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .txn-icon {
            width: 40px;
            height: 40px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            border: 1px solid var(--border-light);
        }

        .txn-info b {
            display: block;
            font-size: 1rem;
        }

        .txn-info span {
            font-size: 0.8rem;
            color: #999;
        }

        .type-tag {
            padding: 4px 8px;
            font-size: 0.7rem;
            font-weight: bold;
            border-radius: 3px;
            display: inline-block;
        }

        .tag-income {
            background: #e8f5e9;
            color: var(--income-green);
        }

        .tag-expense {
            background: #ffebee;
            color: var(--expense-red);
        }

        .txn-date {
            font-size: 0.85rem;
            color: #666;
        }

        .txn-amount {
            font-family: 'Times New Roman', serif;
            font-weight: bold;
            font-size: 1.1rem;
            text-align: right;
            margin-right: 10px;
        }

        .amt-income {
            color: var(--income-green);
        }

        .amt-expense {
            color: var(--expense-red);
        }

        .delete-btn {
            border: none;
            background: transparent;
            color: #ccc;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .delete-btn:hover {
            color: var(--expense-red);
        }
    </style>
</head>

<body>

    <header>
        <div class="logo-box">
            <span class="logo-icon">₹</span>
            <span class="logo-text">Personal Finance Tracker</span>
        </div>
        <div class="user-info">
            <span><i class="fas fa-user-circle"></i> <span id="userBox"></span></span>
            <button class="logout-btn" onclick="logout()">LOGOUT</button>
        </div>
    </header>

    <div class="app">

        <div class="sidebar">
            <p class="sidebar-title">ADD TRANSACTION</p>

            <div class="toggle-container">
                <button id="btnInc" class="toggle-btn active income" onclick="setType('INCOME')">▲ INCOME</button>
                <button id="btnExp" class="toggle-btn expense" onclick="setType('EXPENSE')">▼ EXPENSE</button>
            </div>
            <input type="hidden" id="type" value="INCOME">

            <label>USER ID</label>
            <input id="displayUser" disabled>

            <label>CATEGORY</label>
            <select id="category">
                <option value="Salary">Salary</option>
                <option value="Freelance">Freelance</option>
                <option value="Rent">Rent</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bonus">Bonus</option>
                <option value="Other">Other</option>
            </select>

            <label>AMOUNT (₹)</label>
            <input id="amount" type="number" placeholder="e.g. 75000">

            <label>DESCRIPTION (OPTIONAL)</label>
            <input id="desc" placeholder="e.g. June salary">

            <button class="add-btn" onclick="addTransaction()">+ ADD TRANSACTION</button>
        </div>

        <div class="main">

            <p class="sidebar-title">FINANCIAL SUMMARY</p>
            <div class="summary-row">
                <div class="summary-card card-income">
                    <p class="card-label">TOTAL INCOME</p>
                    <p class="card-amount" id="sumIncome">₹0</p>
                    <p class="card-subtext" id="countIncome">0 entries</p>
                </div>
                <div class="summary-card card-expense">
                    <p class="card-label">TOTAL EXPENSE</p>
                    <p class="card-amount" id="sumExpense">₹0</p>
                    <p class="card-subtext" id="countExpense">0 entries</p>
                </div>
                <div class="summary-card card-balance">
                    <p class="card-label">NET BALANCE</p>
                    <p class="card-amount" id="netBalance">₹0</p>
                    <div id="statusTag" class="surplus-tag">▲ SURPLUS</div>
                </div>
            </div>

            <div class="list-header">
                <h3>Transactions</h3>
            </div>

            <div class="txn-table-head">
                <span>DESCRIPTION</span>
                <span>TYPE</span>
                <span>DATE</span>
                <span style="text-align: right; margin-right: 10px;">AMOUNT</span>
                <span></span>
            </div>

            <div id="list">
            </div>

        </div>
    </div>

    <script>
        const userId = localStorage.getItem("userId");
        const token = localStorage.getItem("token");
        if (!userId || !token) {
            window.location.href = "/login.html";
        }
        document.getElementById("userBox").innerText = userId;
        document.getElementById("displayUser").value = userId;

        const API = "http://localhost:8080/api/transactions";
        let transactions = [];

        window.onload = () => {
            loadTransactions();
        };

        function setType(t) {
            document.getElementById("type").value = t;
            document.getElementById("btnInc").classList.toggle("active", t === 'INCOME');
            document.getElementById("btnExp").classList.toggle("active", t === 'EXPENSE');
        }

        async function loadTransactions() {
            try {
                const res = await fetch(`${API}/user/${userId}`, {
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                });

                const data = await res.json();

                if (data.success) {
                    transactions = data.data;
                    render();
                }

            } catch (e) {
                console.error(e);
            }
        }

        async function addTransaction() {

            const payload = {
                userId: userId,
                type: document.getElementById("type").value,
                category: document.getElementById("category").value,
                amount: Number(document.getElementById("amount").value),
                description: document.getElementById("desc").value,
                date: new Date().toISOString()
            };

            try {
                const res = await fetch(API, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token // ✅ FIX
                    },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (data.success) {
                    transactions.unshift(data.data);
                    render();
                    clearForm();
                } else {
                    alert(data.message);
                }

            } catch (err) {
                console.error(err);
                alert("Server error");
            }
        }

        async function deleteTxn(id) {
            await fetch(`${API}/${id}`, {
                method: "DELETE",
                headers: {
                    "Authorization": "Bearer " + token // ✅ FIX
                }
            });

            transactions = transactions.filter(t => t.id !== id);
            render();
        }

        function render() {
            const list = document.getElementById("list");
            let inc = 0,
                exp = 0,
                incCount = 0,
                expCount = 0;

            list.innerHTML = transactions.map(t => {
                const isInc = t.type === "INCOME";
                if (isInc) {
                    inc += t.amount;
                    incCount++;
                } else {
                    exp += t.amount;
                    expCount++;
                }

                // Determine icon based on category
                let icon = "fa-wallet";
                if (t.category === "Salary") icon = "fa-briefcase";
                if (t.category === "Rent") icon = "fa-home";
                if (t.category === "Food") icon = "fa-hamburger";
                if (t.category === "Transport") icon = "fa-truck";

                return `
                <div class="txn-row">
                    <div class="txn-desc">
                        <div class="txn-icon"><i class="fas ${icon}" style="color: #666"></i></div>
                        <div class="txn-info">
                            <b>${t.category}</b>
                            <span>${t.description || "No description"}</span>
                        </div>
                    </div>
                    <div><span class="type-tag ${isInc ? 'tag-income' : 'tag-expense'}">${t.type}</span></div>
                    <div class="txn-date">${new Date(t.date).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })}</div>
                    <div class="txn-amount ${isInc ? 'amt-income' : 'amt-expense'}">
                        ${isInc ? '+' : '-'}₹${t.amount.toLocaleString()}
                    </div>
                    <button class="delete-btn" onclick="deleteTxn('${t.id}')">×</button>
                </div>`;
            }).join("");

            // Update Summary
            document.getElementById("sumIncome").innerText = `₹${inc.toLocaleString()}`;
            document.getElementById("sumExpense").innerText = `₹${exp.toLocaleString()}`;
            document.getElementById("countIncome").innerText = `${incCount} entries`;
            document.getElementById("countExpense").innerText = `${expCount} entries`;

            const bal = inc - exp;
            document.getElementById("netBalance").innerText = `₹${bal.toLocaleString()}`;
            const tag = document.getElementById("statusTag");
            tag.innerText = bal >= 0 ? "▲ SURPLUS" : "▼ DEFICIT";
            tag.style.background = bal >= 0 ? "#e8f5e9" : "#ffebee";
            tag.style.color = bal >= 0 ? "var(--income-green)" : "var(--expense-red)";
        }

        function clearForm() {
            document.getElementById("amount").value = "";
            document.getElementById("desc").value = "";
        }

        function logout() {
            localStorage.removeItem("userId");
            localStorage.removeItem("token"); // ✅ ADD THIS
            window.location.href = "/login.html";
        }
    </script>
</body>

</html>
