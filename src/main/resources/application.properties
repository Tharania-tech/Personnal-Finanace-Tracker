# ============================================================
#  Personal Finance Tracker - Application Configuration
# ============================================================

# Server Configuration
server.port=${PORT:8080}
spring.application.name=personal-finance-tracker

# ---- MongoDB Configuration ----
# Local MongoDB (no auth)
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017

# MongoDB with Authentication (uncomment if needed)
spring.data.mongodb.uri=mongodb+srv://USERNAME:PASSWORD@cluster.mongodb.net/financedb

# MongoDB Atlas (Cloud - uncomment if needed)
# spring.data.mongodb.uri=mongodb+srv://financeUser:Admin@cluster0.hqjq47x.mongodb.net/?appName=Cluster0

spring.data.mongodb.database=financedb

# ---- Logging ----
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.com.finance.tracker=DEBUG

# ---- Jackson (JSON formatting) ----
spring.jackson.serialization.indent-output=true
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata
